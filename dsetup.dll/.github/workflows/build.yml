name: Build dsetup.dll

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  msvc-x86:
    name: MSVC (Win32, static CRT)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (32-bit)
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Verify exports and ordinals
        run: python tests/check_exports.py build/Release/dsetup.dll

      - uses: actions/upload-artifact@v4
        with:
          name: dsetup-msvc-x86
          path: |
            build/Release/dsetup.dll
            build/Release/dsetup.pdb

  mingw-x86:
    name: MinGW-w64 (i686) + Wine smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make gcc-mingw-w64-i686 binutils-mingw-w64-i686 wine wine32:i386

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_RC_COMPILER=i686-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Verify exports and ordinals
        run: python3 tests/check_exports.py build/dsetup.dll

      - name: Smoke test under Wine
        run: |
          cp build/dsetup.dll tests/
          i686-w64-mingw32-gcc tests/smoke.c -o tests/smoke.exe
          cd tests && WINEDEBUG=-all WINEPREFIX="$RUNNER_TEMP/wp" wine smoke.exe

      - uses: actions/upload-artifact@v4
        with:
          name: dsetup-mingw-x86
          path: build/dsetup.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ msvc-x86, mingw-x86 ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsetup-msvc-x86
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/dsetup.dll
